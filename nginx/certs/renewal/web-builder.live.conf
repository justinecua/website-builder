# renew_before_expiry = 30 days
version = 4.0.0
archive_dir = /etc/letsencrypt/archive/web-builder.live
cert = /etc/letsencrypt/live/web-builder.live/cert.pem
privkey = /etc/letsencrypt/live/web-builder.live/privkey.pem
chain = /etc/letsencrypt/live/web-builder.live/chain.pem
fullchain = /etc/letsencrypt/live/web-builder.live/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 05e5321f3245f997f5d1f1da8a2f7af1
authenticator = webroot
webroot_path = /var/www/webroot,
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
[[webroot_map]]
web-builder.live = /var/www/webroot
